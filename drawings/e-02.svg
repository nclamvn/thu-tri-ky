  <text x="50" y="55" class="id" text-anchor="start">TRI KỶ  /  E-02  /  EVT0</text><text x="50" y="94" class="title" text-anchor="start">Màn hình và chuyển mức</text><text x="50" y="124" class="small" text-anchor="start">Sơ đồ kết nối tín hiệu SPI ghi một chiều và bảng chân đầu nối</text>
  <path class="line" d="M50 146L1110 146"/><rect class="part" x="55" y="180" width="224" height="116" rx="6"/><text x="71" y="204" class="strong" text-anchor="start">U1 · ESP32-S3</text><text x="71" y="227" class="small" text-anchor="start">Logic 3,3 V</text><text x="71" y="246" class="small" text-anchor="start">GPIO9 → /OE (U12)</text><text x="71" y="265" class="small" text-anchor="start">/OE kéo cao mặc định</text><rect class="part" x="431" y="180" width="297" height="116" rx="6"/><text x="447" y="204" class="strong" text-anchor="start">U12 · SN74AXC8T245</text><text x="447" y="227" class="small" text-anchor="start">A: 3,3 V · B: 1,8 V</text><text x="447" y="246" class="small" text-anchor="start">DIR1 / DIR2 cao, A → B</text><text x="447" y="265" class="small" text-anchor="start">A6–A8 giữ mức thấp, B6–B8 NC</text><rect class="part" x="871" y="180" width="230" height="116" rx="6"/><text x="887" y="204" class="strong" text-anchor="start">J1 · LCD Rev1B</text><text x="887" y="227" class="small" text-anchor="start">Molex 40 chân, pitch 0,5</text><text x="887" y="246" class="small" text-anchor="start">VDD: pin 7 / 3,3 V</text><text x="887" y="265" class="small" text-anchor="start">VDDI: pin 8 / 1,8 V</text><text x="58" y="337" class="small" text-anchor="start">GPIO4 · MOSI</text><path class="arrow" d="M190 332L415 332"/><text x="302.5" y="324" class="small" text-anchor="middle"></text><circle class="port" cx="419" cy="332" r="3"/><text x="438" y="337" class="small" text-anchor="start">A1</text><text x="718" y="337" class="small" text-anchor="end">B1</text><circle class="port" cx="737" cy="332" r="3"/><path class="arrow" d="M741 332L851 332"/><text x="796" y="324" class="small" text-anchor="middle"></text><text x="872" y="337" class="small" text-anchor="start">9 · SDA</text><text x="58" y="375" class="small" text-anchor="start">GPIO5 · SCK</text><path class="arrow" d="M190 370L415 370"/><text x="302.5" y="362" class="small" text-anchor="middle"></text><circle class="port" cx="419" cy="370" r="3"/><text x="438" y="375" class="small" text-anchor="start">A2</text><text x="718" y="375" class="small" text-anchor="end">B2</text><circle class="port" cx="737" cy="370" r="3"/><path class="arrow" d="M741 370L851 370"/><text x="796" y="362" class="small" text-anchor="middle"></text><text x="872" y="375" class="small" text-anchor="start">11 · SCL</text><text x="58" y="413" class="small" text-anchor="start">GPIO6 · /CS</text><path class="arrow" d="M190 408L415 408"/><text x="302.5" y="400" class="small" text-anchor="middle"></text><circle class="port" cx="419" cy="408" r="3"/><text x="438" y="413" class="small" text-anchor="start">A3</text><text x="718" y="413" class="small" text-anchor="end">B3</text><circle class="port" cx="737" cy="408" r="3"/><path class="arrow" d="M741 408L851 408"/><text x="796" y="400" class="small" text-anchor="middle"></text><text x="872" y="413" class="small" text-anchor="start">10 · CSX</text><text x="58" y="451" class="small" text-anchor="start">GPIO7 · DC</text><path class="arrow" d="M190 446L415 446"/><text x="302.5" y="438" class="small" text-anchor="middle"></text><circle class="port" cx="419" cy="446" r="3"/><text x="438" y="451" class="small" text-anchor="start">A4</text><text x="718" y="451" class="small" text-anchor="end">B4</text><circle class="port" cx="737" cy="446" r="3"/><path class="arrow" d="M741 446L851 446"/><text x="796" y="438" class="small" text-anchor="middle"></text><text x="872" y="451" class="small" text-anchor="start">12 · DCX</text><text x="58" y="489" class="small" text-anchor="start">GPIO8 · /RESET</text><path class="arrow" d="M190 484L415 484"/><text x="302.5" y="476" class="small" text-anchor="middle"></text><circle class="port" cx="419" cy="484" r="3"/><text x="438" y="489" class="small" text-anchor="start">A5</text><text x="718" y="489" class="small" text-anchor="end">B5</text><circle class="port" cx="737" cy="484" r="3"/><path class="arrow" d="M741 484L851 484"/><text x="796" y="476" class="small" text-anchor="middle"></text><text x="872" y="489" class="small" text-anchor="start">30 · /RES</text><rect class="part" x="55" y="542" width="330" height="114" rx="6"/><text x="71" y="566" class="strong" text-anchor="start">Chế độ và điểm hở</text><text x="71" y="589" class="small" text-anchor="start">31 / 32 / 33 = 0 / 1 / 1</text><text x="71" y="608" class="small" text-anchor="start">1, 13–29, 39 → GND</text><text x="71" y="627" class="small" text-anchor="start">2–6 và 40: để hở</text><rect class="part" x="412" y="542" width="325" height="114" rx="6"/><text x="428" y="566" class="strong" text-anchor="start">U11 · TLV75518</text><text x="428" y="589" class="small" text-anchor="start">3,3 V → LDO 1,8 V</text><text x="428" y="608" class="small" text-anchor="start">1,8 V → VCCB U12 / VDDI LCD</text><text x="428" y="627" class="small" text-anchor="start">Mức cao IM1 và IM2 lấy từ VDDI</text><rect class="part" x="764" y="542" width="337" height="114" rx="6"/><text x="780" y="566" class="strong" text-anchor="start">U2 · TLC5916</text><text x="780" y="589" class="small" text-anchor="start">34–37 → 4 ngõ kéo dòng</text><text x="780" y="608" class="small" text-anchor="start">38 → 4,5 V anode chung</text><text x="780" y="627" class="small" text-anchor="start">VDD U2: 3,3 V. /OE tắt mặc định</text><path class="line" d="M50 674L1110 674"/>
  <text x="50" y="699" class="foot" text-anchor="start">Tên cổng A/B của IC được dùng để xác định net. Tra package RHL0024A cho số chân IC và footprint.</text><text x="50" y="717" class="foot" text-anchor="start">Nguồn chân LCD và cấu hình SPI đối chiếu Newhaven Rev1B. Tụ, điện trở và trình tự nguồn cần xác minh mẫu.</text>
  <text x="1110" y="743" class="id" text-anchor="end">BẢN NGHIÊN CỨU · TK-EVT0</text></svg>