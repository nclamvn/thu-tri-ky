  <text x="50" y="55" class="id" text-anchor="start">TRI KỶ  /  E-01  /  EVT0</text><text x="50" y="94" class="title" text-anchor="start">Sơ đồ nguyên lý phân hệ</text><text x="50" y="124" class="small" text-anchor="start">Nguồn, xử lý trung tâm, thu âm, phát âm và giao tiếp màn hình</text>
  <path class="line" d="M50 146L1110 146"/><rect class="part" x="55" y="196" width="230" height="106" rx="6"/><text x="71" y="220" class="strong" text-anchor="start">J2 / U6 · USB-C 5 V</text><text x="71" y="243" class="small" text-anchor="start">CC1 / CC2 → TUSB320LAI</text><text x="71" y="262" class="small" text-anchor="start">Sink · giới hạn dòng theo CC</text><text x="71" y="281" class="small" text-anchor="start">Bảo vệ VBUS, ESD: ứng viên</text><rect class="part" x="419" y="196" width="308" height="106" rx="6"/><text x="435" y="220" class="strong" text-anchor="start">U7 · BQ25895</text><text x="435" y="243" class="small" text-anchor="start">VBUS → IN, SYS → tải</text><text x="435" y="262" class="small" text-anchor="start">BAT → pack 1S có PCM và NTC</text><text x="435" y="281" class="small" text-anchor="start">TS, CE và giới hạn dòng: cần chốt</text><rect class="part" x="857" y="196" width="245" height="106" rx="6"/><text x="873" y="220" class="strong" text-anchor="start">U8 / U9 · Nguồn</text><text x="873" y="243" class="small" text-anchor="start">TPS63070 × 2</text><text x="873" y="262" class="small" text-anchor="start">3,3 V logic / 4,5 V LED</text><text x="873" y="281" class="small" text-anchor="start">L, C và hồi tiếp: chờ layout</text><rect class="part" x="55" y="374" width="230" height="144" rx="6"/><text x="71" y="398" class="strong" text-anchor="start">M1 / M2 · Micro PDM</text><text x="71" y="421" class="small" text-anchor="start">IM69D128S × 2</text><text x="71" y="440" class="small" text-anchor="start">Chung CLK/DATA, L/R đối pha</text><text x="71" y="459" class="small" text-anchor="start">U4 cắt nguồn VDD_MIC</text><text x="71" y="478" class="small" text-anchor="start">U5 cách ly hai đường PDM</text><rect class="part" x="419" y="374" width="308" height="144" rx="6"/><text x="435" y="398" class="strong" text-anchor="start">U1 · ESP32-S3-WROOM-1</text><text x="435" y="421" class="small" text-anchor="start">GPIO10 PDM CLK, GPIO11 PDM DATA</text><text x="435" y="440" class="small" text-anchor="start">GPIO12/13/14 I²S BCLK/LRCLK/DOUT</text><text x="435" y="459" class="small" text-anchor="start">GPIO4–9 → LCD. GPIO38–41 → đèn nền</text><text x="435" y="478" class="small" text-anchor="start">Định tuyến GPIO là phương án EVT0</text><rect class="part" x="857" y="374" width="245" height="144" rx="6"/><text x="873" y="398" class="strong" text-anchor="start">U3 / SPK1 · Loa</text><text x="873" y="421" class="small" text-anchor="start">MAX98357A / 8 Ω</text><text x="873" y="440" class="small" text-anchor="start">I²S → OUTP và OUTN</text><text x="873" y="459" class="small" text-anchor="start">Hai dây loa nối vi sai</text><text x="873" y="478" class="small" text-anchor="start">VDD của ampli lấy từ SYS</text><rect class="part" x="419" y="552" width="308" height="97" rx="6"/><text x="435" y="576" class="strong" text-anchor="start">J1 · Màn hình Rev1B</text><text x="435" y="599" class="small" text-anchor="start">SPI ghi 1 chiều qua U12</text><text x="435" y="618" class="small" text-anchor="start">Xem sơ đồ tín hiệu E-02</text><path class="arrow" d="M285 252L419 252"/><text x="352" y="244" class="small" text-anchor="middle">VBUS 5 V</text><path class="arrow" d="M727 252L857 252"/><text x="792" y="244" class="small" text-anchor="middle">SYS</text><path class="arrow" d="M727 438L857 438"/><text x="792" y="430" class="small" text-anchor="middle">I²S</text><path class="arrow" d="M285 438L419 438"/><text x="352" y="430" class="small" text-anchor="middle">PDM DATA</text><path class="arrow" d="M419 476L285 476"/><text x="352" y="468" class="small" text-anchor="middle">PDM CLK</text><path class="arrow" d="M572 518L572 551"/><path class="wire" d="M980 302L980 329"/><path class="wire" d="M980 329L574 329"/><path class="arrow" d="M574 329L574 374"/><text x="762" y="322" class="small" text-anchor="middle">3,3 V</text><path class="line" d="M50 674L1110 674"/>
  <text x="50" y="699" class="foot" text-anchor="start">Các đường là kết nối chức năng theo phương án EVT0. GND chung và tụ cục bộ được triển khai khi chốt schematic.</text><text x="50" y="717" class="foot" text-anchor="start">Gạt mute cắt nguồn micro bằng phần cứng. Nguồn pin, bảo vệ và layout RF cần duyệt trước khi làm bo.</text>
  <text x="1110" y="743" class="id" text-anchor="end">BẢN NGHIÊN CỨU · TK-EVT0</text></svg>