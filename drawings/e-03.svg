  <text x="50" y="55" class="id" text-anchor="start">TRI KỶ  /  E-03  /  EVT0</text><text x="50" y="94" class="title" text-anchor="start">Thu âm, ngắt micro và phát loa</text><text x="50" y="124" class="small" text-anchor="start">PDM hai kênh, cách ly miền nguồn micro và đường I²S đến khuếch đại vi sai</text>
  <path class="line" d="M50 146L1110 146"/><rect class="part" x="52" y="183" width="253" height="128" rx="6"/><text x="68" y="207" class="strong" text-anchor="start">SW1 / U4 · Ngắt micro</text><text x="68" y="230" class="small" text-anchor="start">3,3 V → TPS22918 → VDD_MIC</text><text x="68" y="249" class="small" text-anchor="start">SW1 điều khiển ON bằng phần cứng</text><text x="68" y="268" class="small" text-anchor="start">U5 /OE kéo cao mặc định</text><text x="68" y="287" class="small" text-anchor="start">Kiểm Ioff và hồi nguồn khi tắt</text><rect class="part" x="52" y="342" width="253" height="123" rx="6"/><text x="68" y="366" class="strong" text-anchor="start">U1 · ESP32-S3</text><text x="68" y="389" class="small" text-anchor="start">GPIO10 / PDM_CLK → U5.1A</text><text x="68" y="408" class="small" text-anchor="start">GPIO11 / PDM_DATA ← U5.2Y</text><text x="68" y="427" class="small" text-anchor="start">GPIO12/13/14 → I²S</text><rect class="part" x="413" y="342" width="285" height="123" rx="6"/><text x="429" y="366" class="strong" text-anchor="start">U5 · SN74LVC2G125</text><text x="429" y="389" class="small" text-anchor="start">1Y → CLK, 2A ← DATA</text><text x="429" y="408" class="small" text-anchor="start">Mỗi kênh có /OE kéo lên VDD_MIC</text><text x="429" y="427" class="small" text-anchor="start">Enable sau khi VDD_MIC ổn định</text><rect class="part" x="806" y="342" width="296" height="123" rx="6"/><text x="822" y="366" class="strong" text-anchor="start">M1 / M2 · IM69D128S</text><text x="822" y="389" class="small" text-anchor="start">Pin 1 → VDD_MIC, pin 5 → GND</text><text x="822" y="408" class="small" text-anchor="start">Pin 2 chung CLK, pin 3 chung DATA</text><text x="822" y="427" class="small" text-anchor="start">Pin 4: M1 GND, M2 VDD_MIC</text><rect class="part" x="52" y="514" width="253" height="130" rx="6"/><text x="68" y="538" class="strong" text-anchor="start">U1 · Phát I²S</text><text x="68" y="561" class="small" text-anchor="start">GPIO12 → BCLK</text><text x="68" y="580" class="small" text-anchor="start">GPIO13 → LRCLK</text><text x="68" y="599" class="small" text-anchor="start">GPIO14 → DIN</text><text x="68" y="618" class="small" text-anchor="start">GPIO15 → điều khiển SD_MODE</text><rect class="part" x="413" y="514" width="285" height="130" rx="6"/><text x="429" y="538" class="strong" text-anchor="start">U3 · MAX98357A TQFN</text><text x="429" y="561" class="small" text-anchor="start">16 BCLK / 14 LRCLK / 1 DIN</text><text x="429" y="580" class="small" text-anchor="start">VDD ← SYS. Chốt bias SD_MODE</text><text x="429" y="599" class="small" text-anchor="start">OUTP chân 9, OUTN chân 10</text><text x="429" y="618" class="small" text-anchor="start">EP nối mặt GND để thoát nhiệt</text><rect class="part" x="806" y="514" width="296" height="130" rx="6"/><text x="822" y="538" class="strong" text-anchor="start">SPK1 · PUI AS02808MR-R</text><text x="822" y="561" class="small" text-anchor="start">8 Ω / 1 W danh nghĩa</text><text x="822" y="580" class="small" text-anchor="start">OUTP → cọc +, OUTN → cọc −</text><text x="822" y="599" class="small" text-anchor="start">Hai ngõ công suất cách ly với GND</text><path class="arrow" d="M305 385L413 385"/><text x="359" y="377" class="small" text-anchor="middle">CLK</text><path class="arrow" d="M413 433L305 433"/><text x="359" y="425" class="small" text-anchor="middle">DATA</text><path class="arrow" d="M698 385L806 385"/><text x="752" y="377" class="small" text-anchor="middle">CLK</text><path class="arrow" d="M806 433L698 433"/><text x="752" y="425" class="small" text-anchor="middle">DATA</text><path class="arrow" d="M305 570L413 570"/><text x="359" y="562" class="small" text-anchor="middle">I²S</text><path class="arrow" d="M698 570L806 570"/><text x="752" y="562" class="small" text-anchor="middle">BTL</text><path class="wire" d="M305 236L949 236"/><path class="arrow" d="M949 236L949 342"/><path class="arrow" d="M551 236L551 341"/><text x="598" y="225" class="small" text-anchor="middle">VDD_MIC</text><path class="line" d="M50 674L1110 674"/>
  <text x="50" y="699" class="foot" text-anchor="start">Mỗi IM69D128S dùng 100 nF sát pin nguồn. Điện trở tắt/mở, dòng loa, ESD và hồi nguồn cần đo trong mẫu EVT0.</text><text x="50" y="717" class="foot" text-anchor="start">Đối chiếu Infineon bảng 6–7, TI SN74LVC2G125 và Analog Devices MAX98357A bảng chân TQFN.</text>
  <text x="1110" y="743" class="id" text-anchor="end">BẢN NGHIÊN CỨU · TK-EVT0</text></svg>