<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 780" role="img" aria-labelledby="title desc">
  <title id="title">Thu âm, ngắt micro và phát loa</title><desc id="desc">PDM hai kênh, cách ly miền nguồn micro và đường I²S đến khuếch đại vi sai</desc>
  <defs><marker id="dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#573f31"/></marker>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#35443b"/></marker></defs>
  <style>
  text{font:16px system-ui,sans-serif;fill:#222321}.title{font-size:30px;font-weight:700}.strong{font-weight:700}.small{font-size:14px}.foot{font-size:13px;fill:#3c4941}.id{font:600 14px monospace;letter-spacing:1px}
  path{fill:none;stroke:#323232;stroke-width:1.4}marker path{fill:#573f31;stroke:none}.shape{fill:#fbf9f6;stroke:#43413f}.glass{fill:#e9e6e1;stroke:#67625a}.line{stroke:#787878}.hidden{stroke:#96948d;stroke-dasharray:5 5}.axis{stroke:#97968f;stroke-dasharray:7 3 1 3}.dim{stroke:#573f31;marker-start:url(#dim);marker-end:url(#dim)}
  .arrow{stroke:#35443b;marker-end:url(#arrow);stroke-width:1.7}.wire{stroke:#35443b;stroke-width:1.7}.hole{fill:#594d43}.port{fill:#fff;stroke:#35443b;stroke-width:1.4}.part{fill:#f6f5f0;stroke:#6e776c;stroke-width:1.3}
